<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- VIOLET font pack: the exact fonts + fontconfig rules of the cloud render box.
     Renderers set FONTCONFIG_FILE to this file, so every machine picks the same fonts
     (including fallbacks for symbols/emoji) and ignores the system's own fonts. -->
<fontconfig>
	<dir prefix="relative">fonts</dir>
	<include ignore_missing="yes" prefix="relative">conf.d</include>
	<cachedir prefix="relative">cache</cachedir>
</fontconfig>
