<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--S:#FF6B6B;--A:#FFAA5C;--B:#FFD95C;--C:#A8E86A;--F:#6FB2FF;--acc:#EDEDED;--accInk:#0B0B0D;--neg:#FF4D4D;--ink:#0B0B0D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#121316;overflow:hidden}
body{font-family:Inter,sans-serif;color:#EDEDED}
#root{position:absolute;left:0;top:0;overflow:hidden;background:#121316}
.studio{position:absolute;inset:-6%;background:radial-gradient(70% 60% at 50% 42%,#2C3038 0%,#1A1C21 55%,#0E0F12 100%)}
.grid{position:absolute;inset:-6%;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask:radial-gradient(70% 60% at 50% 45%,#000 20%,transparent 75%);-webkit-mask:radial-gradient(70% 60% at 50% 45%,#000 20%,transparent 75%)}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.05) 50%,transparent 65%)}
.glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.10}
.shot{position:absolute;inset:0;display:none}
.in{position:absolute;inset:0;transform-origin:50% 50%}
.ab{position:absolute}
svg{display:block}
/* type */
.kick{font:800 30px Inter;letter-spacing:.14em;color:rgba(237,237,237,.7)}
.big{font:900 italic 150px/0.9 'Inter Display',Inter;letter-spacing:-.03em;color:#fff}
.PL{position:absolute;z-index:20;background:var(--acc);color:var(--accInk);font:900 italic 1px 'Inter Display',Inter;padding:.07em .2em .03em;line-height:1;white-space:nowrap;box-shadow:.12em .12em 0 rgba(0,0,0,.55),0 30px 60px rgba(0,0,0,.45)}
.PL.neg{background:var(--neg);color:#fff}
.src{position:absolute;z-index:20;font:600 16px Inter;color:rgba(237,237,237,.7);background:rgba(0,0,0,.55);padding:5px 10px;border-radius:6px}
/* windows */
.win{position:absolute;background:#141414;border-radius:14px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.09)}
.tb{height:40px;background:#1f1f1f;display:flex;align-items:center;gap:10px;padding:0 14px;font:500 15px Inter;color:#bbb;border-bottom:1px solid #2a2a2a}
.tb .lg{width:18px;height:18px;color:#fff}
.dots{margin-left:auto;display:flex;gap:16px;color:#888;font-size:14px}
.side{position:absolute;left:0;top:40px;bottom:0;width:200px;background:#181818;border-right:1px solid #262626;padding:12px 10px;font:14px Inter;color:#9a9a9a;line-height:2}
.side .on{color:#fff;background:#2a2a2a;border-radius:5px;padding-left:6px}
.code{position:absolute;left:200px;top:40px;bottom:0;right:430px;padding:16px 18px;font:15.5px/1.75 'DejaVu Sans Mono',monospace;color:#d4d4d4;white-space:pre;overflow:hidden}
.k{color:#c586c0}.s{color:#ce9178}.f{color:#dcdcaa}.c{color:#6a9955}.t{color:#4ec9b0}.n{color:#9cdcfe}
.agent{position:absolute;right:0;top:40px;bottom:0;width:430px;background:#1a1a1a;border-left:1px solid #262626;padding:14px;font:15px/1.5 Inter;color:#ddd}
.agent h4{font:700 13px Inter;color:#888;letter-spacing:.08em;margin-bottom:10px}
.msg{background:#2d2d3a;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.task{display:flex;align-items:center;gap:8px;background:#222;border:1px solid #333;border-radius:8px;padding:9px 10px;margin-bottom:8px;font:600 14px Inter}
.task .st{margin-left:auto;font:700 12px Inter;padding:2px 7px;border-radius:5px}
.run{background:#2b3a55;color:#8fb4f0}.ok{background:#1f4a2c;color:#7ee787}
.bar{height:4px;background:#2a2a2a;border-radius:2px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#8fb4f0}
.model{position:absolute;right:14px;bottom:14px;left:14px;background:#222;border:1px solid #333;border-radius:10px;padding:10px 12px;font:600 14px Inter;color:#ccc}
.dd{position:absolute;background:#232323;border:1px solid #3a3a3a;border-radius:12px;padding:6px;font:600 16px Inter;color:#ddd;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dd div{padding:9px 12px;border-radius:7px;display:flex;align-items:center;gap:10px}
.dd .sel{background:#2f3b52}
.chrome .tb{background:#202124;border-bottom:none}
.url{height:44px;background:#35363a;display:flex;align-items:center;padding:0 14px}
.url span{background:#202124;border-radius:20px;padding:6px 16px;font:15px Inter;color:#e8eaed;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{position:absolute;left:0;right:0;top:84px;bottom:0;background:#fff;color:#111;overflow:hidden}
.news{padding:40px 56px}
.news .kk{font:700 15px Inter;color:#c4161c;letter-spacing:.08em}
.news h1{font:800 50px/1.12 Georgia,serif;margin:14px 0 16px;color:#111}
.news .meta{font:15px Inter;color:#666}
.news p{font:19px/1.6 Georgia,serif;color:#333;margin-top:20px}
/* price cards */
.pc{position:absolute;width:240px;height:300px;background:#161616;border:1px solid #2f2f2f;border-radius:16px;padding:20px 18px;color:#aaa;font:15px/1.55 Inter;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pc b{display:block;font:800 21px Inter;color:#fff}
.pc .p{font:800 44px Inter;color:#fff;margin:8px 0 12px}
.pc .p small{font:500 15px Inter;color:#888}
.pc li{list-style:none;margin:5px 0}
.pc .lgc{position:absolute;right:16px;top:18px;width:26px;height:26px;color:#fff}
/* logo tiles */
.tile{position:absolute;width:220px;height:220px;border-radius:44px;background:#1c1d21;border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);font:800 26px Inter;color:#fff}
.tile .lg{width:96px;height:96px;color:#fff}
/* board */
.board{position:absolute;background:rgba(14,15,18,.86);border:1px solid rgba(255,255,255,.1);border-radius:20px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.btitle{position:absolute;font:900 italic 38px Inter;color:#fff}.btitle b{color:var(--B)}
.row{position:absolute;display:flex;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.04)}
.lab{display:flex;align-items:center;justify-content:center;font:900 70px 'Inter Display',Inter;color:#111}
.flash{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;width:150px;height:150px;border-radius:16px;background:#1c1d21;border:2px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.card .lg{width:60px;height:60px;color:#fff}.card .nm{font:800 20px Inter;color:#fff}
.card .pr{font:800 15px Inter;color:#111;background:var(--acc);padding:2px 8px;border-radius:6px}
.ghost{position:absolute;width:150px;height:150px;border-radius:16px;border:2px dashed rgba(255,255,255,.12)}
.hl{position:absolute;border:4px solid var(--B);border-radius:12px;box-shadow:0 0 0 2px rgba(0,0,0,.5),0 0 34px rgba(255,217,92,.45);display:none}
.strike{position:absolute;z-index:21;height:9px;background:var(--neg);border-radius:5px}
</style></head><body>
<div id="root"></div>
